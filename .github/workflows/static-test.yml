    - name: buildsystem
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'buildsystem')
      uses: ./.github/actions/static-test
      with:
        tests: buildsystem
    - name: feature_resolution
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'feature_resolution')
      uses: ./.github/actions/static-test
      with:
        tests: feature_resolution
    - name: boards_supported
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'boards_supported')
