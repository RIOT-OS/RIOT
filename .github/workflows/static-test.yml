name: static-tests

on:
  push:
    branches:
      - master
      - staging
      - trying
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9]-RC[0-9]*'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].*'
  pull_request:
    branches:
      - '*'
  merge_group:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.filter.outputs.changes }}
    steps:
    - uses: actions/checkout@main
    - name: Detect changed files
      uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: .github/static-test-paths.yml
  static-tests:
    needs: changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Set CI_BASE_BRANCH
      run: |
        # Figure out the correct base branch to work on...

        if [ -n "${{ github.base_ref }}" ]; then
          echo "CI_BASE_BRANCH=${{ github.base_ref }}" >> $GITHUB_ENV
        elif [ -n "${{ github.event.merge_group.base_ref }}" ]; then
          echo "CI_BASE_BRANCH=${{ github.event.merge_group.base_ref }}" | sed s.=refs/heads/.=. >> $GITHUB_ENV
        fi

        echo "Base Branch: origin/$(grep '^CI_BASE_BRANCH=' $GITHUB_ENV | cut -d= -f2-)"
    - name: Setup git
      run: |
        # Configuring and rebasing the repository...

        # Name and E-Mail required for rebasing
        git config user.name "statictester"
        git config user.email "statictester@riot.invalid"

        # Note: CI_BASE_BRANCH is empty when not in a PR
        if [ -n "${CI_BASE_BRANCH}" ]; then
          git fetch origin ${CI_BASE_BRANCH}:${CI_BASE_BRANCH} --no-tags
          echo "Rebasing PR branch onto origin/${CI_BASE_BRANCH}..."
          git rebase origin/${CI_BASE_BRANCH}
        else
          git config diff.renameLimit 16384
        fi
        git config apply.whitespace nowarn
    - name: Fetch riot/static-test-tools Docker image
      run: docker pull riot/static-test-tools:latest
    - name: whitespacecheck
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'whitespacecheck')
      uses: ./.github/actions/static-test
      with:
        tests: whitespacecheck
    - name: licenses
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'licenses')
      uses: ./.github/actions/static-test
      with:
        tests: licenses
    - name: features
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'features')
      uses: ./.github/actions/static-test
      with:
        tests: features
    - name: doccheck
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'doccheck')
      uses: ./.github/actions/static-test
      with:
        tests: doccheck
    - name: externc
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'externc')
      uses: ./.github/actions/static-test
      with:
        tests: externc
    - name: vera
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'vera')
      uses: ./.github/actions/static-test
      with:
        tests: vera
    - name: coccinelle
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'coccinelle')
      uses: ./.github/actions/static-test
      with:
        tests: coccinelle
    - name: flake8
      if: github.event_name == 'push' || contains(fromJSON(needs.changes.outputs.tests), 'flake8')
      uses: ./.github/actions/static-test
