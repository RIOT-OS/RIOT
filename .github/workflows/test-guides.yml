name: Guide Build Test

on:
  pull_request:
    paths:
      - 'doc/guides/**'
      - 'doc/starlight/**'
      - 'boards/**/doc*.md'
      - 'cpu/**/doc*.md'
      - 'CODE_OF_CONDUCT.md'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'CODING_CONVENTIONS*.md'
      - 'release-notes.txt'

jobs:
  build-guide:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doc/starlight
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
            node-version: '25.x'
      - name: Build documentation
        run: make build
      - name: Test the conversion of the board and CPU documentation
        run: npm test
